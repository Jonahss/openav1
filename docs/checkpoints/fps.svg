<text x="802.0" y="289.7" font-size="12.5" fill="#52514e" text-anchor="end">vertical groups a cycle (90 MHz)</text>
<text x="872.7" y="301.1" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">16.3</text>
<text x="872.7" y="318.1" font-size="12.5" fill="#52514e" text-anchor="start">timing fixes: back to 100 MHz</text>
