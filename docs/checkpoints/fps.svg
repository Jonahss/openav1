<text x="366.3" y="351.4" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="end">10.0</text>
<text x="366.3" y="368.4" font-size="12.5" fill="#52514e" text-anchor="end">reference prefetch, second tile</text>
<text x="366.3" y="385.4" font-size="12.5" fill="#52514e" text-anchor="end">engine, faster state loading</text>
<text x="430.9" y="334.8" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">11.8</text>
<text x="430.9" y="351.8" font-size="12.5" fill="#52514e" text-anchor="start">shorter reference queue</text>
<text x="777.8" y="255.7" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="end">14.8</text>
<text x="777.8" y="272.7" font-size="12.5" fill="#52514e" text-anchor="end">filter: two patch words and two</text>
<text x="777.8" y="289.7" font-size="12.5" fill="#52514e" text-anchor="end">vertical groups a cycle (90 MHz)</text>
<text x="847.1" y="301.1" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">16.3</text>
<text x="847.1" y="318.1" font-size="12.5" fill="#52514e" text-anchor="start">timing fixes: back to 100 MHz</text>
