<text x="376.8" y="368.4" font-size="12.5" fill="#52514e" text-anchor="end">reference prefetch, second tile</text>
<text x="376.8" y="385.4" font-size="12.5" fill="#52514e" text-anchor="end">engine, faster state loading</text>
<text x="442.7" y="334.8" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">11.8</text>
<text x="442.7" y="351.8" font-size="12.5" fill="#52514e" text-anchor="start">shorter reference queue</text>
